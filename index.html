<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment</title>

  <style>
    .body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #333;
    }

    .title {
      text-align: center;
      font-size: 2.5em;
      margin-top: 50px;
      color: black;
      font-weight: bold;
    }

    .description {
      text-align: center;
      font-size: 1.2em;
      margin-top: 20px;
      color: black;
    }

    .projects-list {
      list-style-type: none;
      padding: 0;
      text-align: center;
      margin-top: 30px;
    }

    .projects-list li {
      margin: 10px;
      display: inline-block;
    }

    .projects-list li a {
      text-decoration: none;
      display: block;
      width: 200px;
      height: 200px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .projects-list li a:hover {
      transform: scale(1.05);
      transition: transform 0.3s;
    }

    .projects-list li img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .subheading {
      text-align: center;
      font-size: 1.8em;
      margin-top: 40px;
      color: #5e4b8b;
    }

    .image-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .image-container img {
      width: 150px;
      height: 150px;
      border-radius: 8px;
      transition: transform 0.3s;
    }

    .image-container img:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body class="body">

  <h1 class="title">ASSIGNMENT</h1>

      </a>
    </li>
    <li>
      <a href="bootA.html">
        <img src="https://www.openlogic.com/sites/default/files/image/2024-05/image-ol-boostrap-framwork-basics.jpg.jpeg" alt="Bootstrap Projects">
      </a>
    </li>
  </ul>

</body>
</html>
