<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background-image: url('https://www.emailonacid.com/wp-content/uploads/2011/11/EOA-ValidateHTML19-Blog.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      height: 100vh;
      margin: 0;
    }

    h1 {
      font-size: 2.5em;
      margin-top: 50px;
      color: white;
    }

    p {
      font-size: 1.2em;
      margin-top: 20px;
      color: white;
    }

    .projects-list {
      list-style-type: none;
      padding: 0;
      margin-top: 30px;
    }

    .projects-list li {
      margin: 10px;
    }

    .projects-list li a {
      text-decoration: none;
    }

    .projects-list li a button {
      display: block;
      width: 200px;
      height: 50px;
      border-radius: 8px;
      background-color: black;
      color: white;
      font-size: 1.5em;
      border: none;
      cursor: pointer;
      transition: transform 0.3s, background-color 0.3s;
    }

    .projects-list li a button:hover {
      transform: scale(1.05);
      background-color: #333;
    }
  </style>
</head>
<body>

  

  <ul class="projects-list">
    <li>
      <a href="html1.html"><button>HTML1</button></a>
    </li>
    <li>
      <a href="html2.html"><button>HTML2</button></a>
    </li>
    <li>
      <a href="html3.html"><button>HTML3</button></a>
    </li>
  </ul>

</body>
</html>
