<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .form-control:invalid {
      border-color: #dc3545;
      padding-right: 2.5rem;
    }
    .form-control.is-invalid ~ .invalid-feedback {
      display: block;
    }
    .form-icon {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      color: #dc3545;
    }
    .form-group {
      position: relative;
      margin-bottom: 1.5rem;
    }
    .btn-red {
      background-color: #dc3545;
      color: white;
    }
    .btn-red:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>
  <div class="container mt-5" style="max-width: 500px;">
    <form id="myForm" novalidate>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" class="form-control" id="name" required>
        <i class="fas fa-info-circle form-icon d-none" id="icon-name"></i>
        <div class="invalid-feedback">Name is required</div>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" class="form-control" id="email" required>
        <i class="fas fa-info-circle form-icon d-none" id="icon-email"></i>
        <div class="invalid-feedback">Email is required</div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password" required>
        <i class="fas fa-info-circle form-icon d-none" id="icon-password"></i>
        <div class="invalid-feedback">Password is required</div>
      </div>
      <div class="form-group">
        <label for="hobbies">Hobbies</label>
        <select class="form-select" id="hobbies">
          <option value="">Select a hobby</option>
          <option>Reading</option>
          <option>Traveling</option>
          <option>Gaming</option>
        </select>
      </div>
      <button type="submit" class="btn btn-red w-100">Submit</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("myForm");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      let valid = true;

      ["name", "email", "password"].forEach(id => {
        const field = document.getElementById(id);
        const icon = document.getElementById(`icon-${id}`);

        if (!field.value.trim()) {
          field.classList.add("is-invalid");
          icon.classList.remove("d-none");
          valid = false;
        } else {
          field.classList.remove("is-invalid");
          icon.classList.add("d-none");
        }
      });

      if (valid) {
        alert("Form submitted successfully!");
      }
    });
  </script>
</body>
</html>
